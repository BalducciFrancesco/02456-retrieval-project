method: "dpr"
index_path: "index/dpr_index_{dataset}.pkl"

grid_search:  # every combination is trained and scored on val
  name: "grid_search_1"  # prefix of trial file names; same name + same params reuses saved weights
  epochs: [10, 15]
  lr: [1e-4, 5e-4]
  batch_size: [16, 32]
  pooling_type: ['mean', 'cls']

query_encoder:
  name: prajjwal1/bert-tiny
  emb_dim: 128
  hidden_dim: 32
  n_heads: 4
  n_layers: 6
  feed_forward_dim: 768

document_encoder:
  name: prajjwal1/bert-tiny
  emb_dim: 128
  hidden_dim: 32
  n_heads: 4
  n_layers: 6
  feed_forward_dim: 768